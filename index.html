<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JWTech feed</title>
<style>
  body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#1d2433;background:#fff}
  code{background:#f1f3f7;padding:2px 6px;border-radius:4px}
  td{padding:4px 12px 4px 0}
</style>
</head>
<body>
<h1>JWTech · фид для tomas.kz</h1>
<p>Фид: <code><a href="feed.xml">feed.xml</a></code></p>
<table id="s"></table>
<script>
fetch('stats.json').then(r=>r.json()).then(s=>{
  const L={generated_at:'Собран',source_offers:'Товаров у поставщика',published:'Опубликовано',in_stock:'В наличии',out_of_stock:'Нет в наличии',on_demand:'Под заказ (без цены)',markdown_removed:'Уценка (убрана)',markup:'Наценка к дилерской'};
  document.getElementById('s').innerHTML=Object.entries(L).map(([k,v])=>`<tr><td>${v}</td><td><b>${k==='markup'?Math.round(s[k]*100)+'%':s[k]}</b></td></tr>`).join('');
}).catch(()=>{});
</script>
</body>
</html>
